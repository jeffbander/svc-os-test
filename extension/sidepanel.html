<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardiac CT Prior-Auth Badge</title>
    <style>
      :root {
        --bg: #f5f2ec;
        --surface: #faf8f4;
        --rule: #e3dfd5;
        --text: #1a1814;
        --text-secondary: #5a574f;
        --text-tertiary: #8c887e;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
        background: var(--surface);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-tertiary);
      }
      .empty {
        padding: 24px;
        font-size: 14px;
        color: var(--text-secondary);
        text-align: center;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: var(--bg);
      }
      footer {
        padding: 8px 16px;
        border-top: 1px solid var(--rule);
        background: var(--surface);
        font-size: 11px;
        color: var(--text-tertiary);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>Cardiac CT prior-authorization</header>
    <div id="frame-container">
      <div class="empty" id="empty-state">
        Navigate to a HeartFlow patient view to load the prior-auth badge.
      </div>
    </div>
    <footer>Read-only badge · Mount Sinai pilot · Synthetic data only</footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
